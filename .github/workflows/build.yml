name: Build Plugin

on:
  push:
    branches:
      - nightly
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.yml'
      - '**/*.yaml'
  pull_request:
    branches:
      - nightly
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.yml'
      - '**/*.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project (Default)
        run: dotnet build src/RegionInstaller.csproj --no-restore -c Default

      - name: Build Project (Lite)
        run: dotnet build src/RegionInstaller.csproj --no-restore -c Lite

      - name: Wait for file system sync
        run: sleep 5

      - name: Upload Build Artifact (Default)
        uses: actions/upload-artifact@v4
        with:
          name: RegionInstaller.dll
          path: src/bin/Default/net6.0/RegionInstaller.dll

      - name: Upload Build Artifact (Lite)
        uses: actions/upload-artifact@v4
        with:
          name: RegionInstallerLite.dll
          path: src/bin/Lite/net6.0/RegionInstallerLite.dll

      - name: Upload Release Asset (Default)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/bin/Default/net6.0/RegionInstaller.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}